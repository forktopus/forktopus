# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "forktopus"
arch: ${GOARCH}
platform: "linux"
version: "0.3.1"
section: "devel"
priority: "extra"
maintainer: "yarkovaleksei <yarkov_aleksei@mail.ru>"
description: "Все ваши Git-репозитории на одном экране"
vendor: "Forktopus"
homepage: "https://github.com/forktopus/forktopus"
license: "MIT"
release: "1"

contents:
  - src: "./bin/forktopus"
    dst: "/usr/bin/forktopus"
    file_info:
      mode: 0755
  # 256×256 с прозрачным фоном (scripts/make-icon.sh); меньшие размеры GNOME масштабирует сам.
  - src: "./frontend/public/forktopus-icon.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/forktopus.png"
  - src: "./build/linux/forktopus.desktop"
    dst: "/usr/share/applications/forktopus.desktop"
    file_info:
      mode: 0644

  # Ubuntu 24.04 требует отдельного разрешения userns для песочницы WebKit.
  - src: "./build/linux/apparmor/forktopus"
    dst: "/etc/apparmor.d/forktopus"
    type: config
    packager: deb
    file_info:
      mode: 0644

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  deb:
    scripts:
      postinstall: "./build/linux/nfpm/scripts/deb-postinstall.sh"
      preremove: "./build/linux/nfpm/scripts/deb-preremove.sh"
      postremove: "./build/linux/nfpm/scripts/postremove.sh"
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
